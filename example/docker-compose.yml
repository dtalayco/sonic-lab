version: "3.9"

x-sonic-common: &sonic-common
  image: docker-sonic-vs:latest
  platform: linux/arm64
  privileged: true
  tty: true
  shm_size: "2gb"
  security_opt:
    - seccomp=unconfined

x-debian-common: &debian-common
  build:
    context: ..
    dockerfile: Dockerfile.debian
  image: sonic-lab/debian:latest
  platform: linux/arm64
  privileged: true
  tty: true
  volumes:
    - ./init_linux.sh:/init_linux.sh:ro
    - /var/run/docker.sock:/var/run/docker.sock
    - ./tmp/vnet_ready:/tmp/vnet_ready:rw
  shm_size: "2gb"

x-host-common: &host-common
  build:
    context: ..
    dockerfile: Dockerfile.host
  image: sonic-lab/host:latest
  platform: linux/arm64
  privileged: true
  tty: true

services:
  #################################
  # Webmesh patch panel container #
  #################################

  webmesh:
    build:
      context: ..
      dockerfile: Dockerfile.webmesh
    image: sonic-lab/webmesh:latest
    platform: linux/arm64
    privileged: true
    pid: "host"
    container_name: webmesh
    ports:
      - "8092:9090"
    volumes:
      - ./topology.yml:/etc/webmesh/topology.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./tmp/vnet_ready:/tmp/vnet_ready:rw
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9090/v1/status | grep -q '\"healthy\":true'"]
      interval: 2s
      timeout: 3s
      retries: 60

  ###########################
  # Backing Linux containers #
  ###########################

  spine1-linux:
    <<: *debian-common
    container_name: spine1-linux
    command: ["bash", "/init_linux.sh", "spine1-linux"]

  spine2-linux:
    <<: *debian-common
    container_name: spine2-linux
    command: ["bash", "/init_linux.sh", "spine2-linux"]

  leaf1-linux:
    <<: *debian-common
    container_name: leaf1-linux
    command: ["bash", "/init_linux.sh", "leaf1-linux"]

  leaf2-linux:
    <<: *debian-common
    container_name: leaf2-linux
    command: ["bash", "/init_linux.sh", "leaf2-linux"]

  leaf3-linux:
    <<: *debian-common
    container_name: leaf3-linux
    command: ["bash", "/init_linux.sh", "leaf3-linux"]

  leaf4-linux:
    <<: *debian-common
    container_name: leaf4-linux
    command: ["bash", "/init_linux.sh", "leaf4-linux"]

  ###########################
  # SONiC VS containers      #
  ###########################

  spine1:
    <<: *sonic-common
    container_name: sonic-spine1
    depends_on:
      webmesh:
        condition: service_healthy
      spine1-linux:
        condition: service_started
    network_mode: "service:spine1-linux"
    volumes:
      - ./tmp/vnet_ready:/tmp/vnet_ready:ro
      - /var/run/redis-vs/spine1:/var/run/redis
      - ./sonic_entry.sh:/sonic_entry.sh:ro
      - ./frr/spine1.conf:/tmp/frr.conf:ro
    entrypoint: ["/bin/bash", "/sonic_entry.sh", "spine1-linux", "fd00:0:0:fde8::1/128"]

  spine2:
    <<: *sonic-common
    container_name: sonic-spine2
    depends_on:
      webmesh:
        condition: service_healthy
      spine2-linux:
        condition: service_started
    network_mode: "service:spine2-linux"
    volumes:
      - ./tmp/vnet_ready:/tmp/vnet_ready:ro
      - /var/run/redis-vs/spine2:/var/run/redis
      - ./sonic_entry.sh:/sonic_entry.sh:ro
      - ./frr/spine2.conf:/tmp/frr.conf:ro
    entrypoint: ["/bin/bash", "/sonic_entry.sh", "spine2-linux", "fd00:0:0:fde9::1/128"]

  leaf1:
    <<: *sonic-common
    container_name: sonic-leaf1
    depends_on:
      webmesh:
        condition: service_healthy
      leaf1-linux:
        condition: service_started
    network_mode: "service:leaf1-linux"
    volumes:
      - ./tmp/vnet_ready:/tmp/vnet_ready:ro
      - /var/run/redis-vs/leaf1:/var/run/redis
      - ./sonic_entry.sh:/sonic_entry.sh:ro
      - ./frr/leaf1.conf:/tmp/frr.conf:ro
    entrypoint: ["/bin/bash", "/sonic_entry.sh", "leaf1-linux", "fd00:0:0:fe4c::1/128"]

  leaf2:
    <<: *sonic-common
    container_name: sonic-leaf2
    depends_on:
      webmesh:
        condition: service_healthy
      leaf2-linux:
        condition: service_started
    network_mode: "service:leaf2-linux"
    volumes:
      - ./tmp/vnet_ready:/tmp/vnet_ready:ro
      - /var/run/redis-vs/leaf2:/var/run/redis
      - ./sonic_entry.sh:/sonic_entry.sh:ro
      - ./frr/leaf2.conf:/tmp/frr.conf:ro
    entrypoint: ["/bin/bash", "/sonic_entry.sh", "leaf2-linux", "fd00:0:0:fe4d::1/128"]

  leaf3:
    <<: *sonic-common
    container_name: sonic-leaf3
    depends_on:
      webmesh:
        condition: service_healthy
      leaf3-linux:
        condition: service_started
    network_mode: "service:leaf3-linux"
    volumes:
      - ./tmp/vnet_ready:/tmp/vnet_ready:ro
      - /var/run/redis-vs/leaf3:/var/run/redis
      - ./sonic_entry.sh:/sonic_entry.sh:ro
      - ./frr/leaf3.conf:/tmp/frr.conf:ro
    entrypoint: ["/bin/bash", "/sonic_entry.sh", "leaf3-linux", "fd00:0:0:fe4e::1/128"]

  leaf4:
    <<: *sonic-common
    container_name: sonic-leaf4
    depends_on:
      webmesh:
        condition: service_healthy
      leaf4-linux:
        condition: service_started
    network_mode: "service:leaf4-linux"
    volumes:
      - ./tmp/vnet_ready:/tmp/vnet_ready:ro
      - /var/run/redis-vs/leaf4:/var/run/redis
      - ./sonic_entry.sh:/sonic_entry.sh:ro
      - ./frr/leaf4.conf:/tmp/frr.conf:ro
    entrypoint: ["/bin/bash", "/sonic_entry.sh", "leaf4-linux", "fd00:0:0:fe4f::1/128"]
