topology:
    name: spine-leaf-1x2
    switches:
        leaf1:
            role: leaf
            asn: 65100
            ports:
                Ethernet0: {}
        leaf2:
            role: leaf
            asn: 65101
            ports:
                Ethernet0: {}
        spine1:
            role: spine
            asn: 65000
            ports:
                Ethernet0: {}
                Ethernet4: {}
    links:
        - endpoints:
            - device: spine1-linux
              port: Ethernet0
            - device: leaf1-linux
              port: Ethernet0
        - endpoints:
            - device: spine1-linux
              port: Ethernet4
            - device: leaf2-linux
              port: Ethernet0
