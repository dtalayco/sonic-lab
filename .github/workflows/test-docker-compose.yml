name: Test Docker Compose

on:
  pull_request:
    branches: [ main ]

env:
  GO_VERSION: "1.25"

jobs:
  # Unit tests for both Go modules. They need no Docker and finish quickly,
  # so they run in parallel with the (much slower) topology bring-ups.
  go-tests:
    name: go/${{ matrix.module }}
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        module: [tgen, webmesh]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run unit tests
        working-directory: ${{ matrix.module }}
        run: go test ./...

  # For each topology: generate it with tgen, build and bring the lab up,
  # then verify that every switch establishes the BGP sessions its generated
  # FRR config declares. The expected count is read straight from the tgen
  # output (one "neighbor ... interface" line per session), so the check is
  # fully driven by the generator and needs no hardcoding.
  topology:
    name: topology/${{ matrix.topology }}
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - topology: spine-leaf
            tgen-args: "-s 2 -l 4"
          - topology: ring
            tgen-args: "-r -n 4"
          - topology: mesh
            tgen-args: "-m -n 4"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Install Docker Compose v2
        run: |
          # Download and install docker compose v2
          sudo mkdir -p /usr/local/lib/docker/cli-plugins
          sudo curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/lib/docker/cli-plugins/docker-compose
          sudo chmod +x /usr/local/lib/docker/cli-plugins/docker-compose

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            iproute2 \
            util-linux \
            jq

      - name: Pull docker-sonic-vs image
        run: |
          # Pull the arm64 docker-sonic-vs image from GHCR
          docker pull ghcr.io/mestery/docker-sonic-vs:latest

          # The compose files reference docker-sonic-vs:latest, so retag
          # the pulled image to match.
          docker tag ghcr.io/mestery/docker-sonic-vs:latest docker-sonic-vs:latest

          # Verify the image is present
          docker images | grep -q "docker-sonic-vs" || { echo "Error: docker-sonic-vs image is not present"; exit 1; }

      - name: Build tgen
        working-directory: tgen
        run: go build -o tgen .

      - name: Generate topology with tgen
        run: ./tgen/tgen ${{ matrix.tgen-args }} -o ./ci-${{ matrix.topology }}/

      - name: Validate Docker Compose file
        run: docker compose -f ci-${{ matrix.topology }}/docker-compose.yml config --quiet

      - name: Build all images
        run: docker compose -f ci-${{ matrix.topology }}/docker-compose.yml build

      - name: Bring up the lab
        run: |
          DIR="ci-${{ matrix.topology }}"
          COMPOSE="docker compose -f $DIR/docker-compose.yml"

          # Patch panel first, then the backing netns containers.
          $COMPOSE up -d webmesh
          $COMPOSE up -d $($COMPOSE config --services | grep -- '-linux$')

          # webmesh only reports healthy once every link is wired, so gate
          # the SONiC bring-up on that.
          for i in $(seq 1 90); do
            status=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}starting{{end}}' webmesh 2>/dev/null || echo "starting")
            if [ "$status" = "healthy" ]; then
              echo "webmesh is healthy — all links wired"
              break
            fi
            if [ "$i" -eq 90 ]; then
              echo "Timed out waiting for webmesh to wire links"
              docker logs webmesh
              exit 1
            fi
            sleep 2
          done

          # Start the SONiC containers (compose waits for webmesh healthy).
          $COMPOSE up -d

          echo "Running containers:"
          docker ps --filter "name=sonic-"

      - name: Verify BGP converged on every switch
        run: |
          # Opt out of the inherited errexit: a failing docker exec or grep
          # just yields a count of 0, which we handle explicitly below.
          set +e

          DIR="ci-${{ matrix.topology }}"

          for conf in "$DIR"/frr/*.conf; do
            sw=$(basename "$conf" .conf)
            # Each BGP session is one "neighbor <iface> interface" line.
            expected=$(grep -c "interface peer-group TRANSIT" "$conf")
            container="sonic-$sw"

            # Poll until every declared session is established (max ~5 min).
            # `show bgp summary` lists each neighbor once: an established peer
            # shows a number in its State/PfxRcd column (field 10), a down peer
            # a BGP FSM state word; newer FRR prints the literal "Establ". So
            # "established" == field 10 all-digits, or the row carries "Establ".
            ok=0
            for i in $(seq 1 60); do
              actual=$(docker exec "$container" vtysh -c "show bgp summary" 2>/dev/null | awk '$10 ~ /^[0-9]+$/ || /Establ/ {n++} END {print n+0}')
              if [ "${actual:-0}" -ge "$expected" ]; then ok=1; break; fi
              sleep 5
            done

            actual=$(docker exec "$container" vtysh -c "show bgp summary" 2>/dev/null | awk '$10 ~ /^[0-9]+$/ || /Establ/ {n++} END {print n+0}')
            echo "$container: ${actual:-0}/${expected} BGP sessions established"
            if [ "$ok" -ne 1 ]; then
              echo "FAIL: $container only established ${actual:-0}/${expected} BGP sessions"
              docker exec "$container" vtysh -c "show bgp summary" || true
              exit 1
            fi
          done

          echo "All switches in $DIR reached full BGP convergence."

      - name: Cleanup
        if: always()
        run: docker compose -f ci-${{ matrix.topology }}/docker-compose.yml down --remove-orphans || true